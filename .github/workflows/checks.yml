name: Validate Seed Watch Security & API
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'offline/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node API and offline BIP39 tests
        run: node --test tests/*.test.mjs
